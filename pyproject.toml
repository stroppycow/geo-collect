[project]
name = "rnipp-geo-data-collector"
version = "0.0.1"
authors = [
  { name="Théo Leroy", email="theo.leroy@insee.fr" },
]
description = "Geographic data collector for "
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"


[tool.poetry]
packages = [{include = "rnipp_geo_data_collector", from = "src"}]


[tool.poetry.dependencies]
tqdm = "^4.70.1"
pandas = "^3.1.1"
igraph = "^1.0.0"
numpy = "^2.5.4"
urllib3 = "^2.8.0"
requests = "^2.34.2"
typer = "^0.29.1"
pydantic = "^2.14.3"
pydantic-settings = "^2.16.3"
validators = "^0.36.0"
duckdb = "^2.0.0"
pystache = "^0.6.8"
PyYAML = "^6.0.3"
rapidfuzz="^3.14.6"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rnipp_geo_data_collector*"]

[project.scripts]
geo_data_collector = "rnipp_geo_data_collector.cli:app"
[dependency-groups]
dev = [
    "ipykernel (>=7.2.0,<8.0.0)",
    "ruff (>=0.17.0,<0.18.0)",
    "pyright (>=1.1.414,<2.0.0)"
]
docs = [
    "mkdocs-material (>=9.7.7,<10.0.0)",
    "mkdocstrings[python] (>=1.0.7,<2.0.0)"
]

[tool.pyright]
# Analyse du code source et des tests.
include = ["src", "tests"]
pythonVersion = "3.12"
# Environnement virtuel du projet pour la résolution des imports.
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.ruff.lint]
# EM101/EM102 (message d'exception en littéral/f-string) et TRY003 (message
# long hors de la classe d'exception) sont trop contraignants pour des
# messages d'erreur utiles à l'utilisateur.
ignore = ["EM101", "EM102", "TRY003"]
